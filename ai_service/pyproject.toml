[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "B008",  # Do not perform function call in argument defaults (FastAPI Form/File/Depends dependency injection)
    "E501",  # Line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
