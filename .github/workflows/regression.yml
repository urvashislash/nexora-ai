name: Regression & E2E Validation

on:
  push:
    branches:
      - production
      - main
  pull_request:
    branches:
      - production
      - main

jobs:
  validate:
    name: 🛡️ Regression & E2E Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai_service/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run AI Service Unit Tests
        run: |
          cd ai_service
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

      - name: Run End-to-End Tests
        run: |
          cd ai_service
          PYTHONPATH=. python -m pytest ../tests/e2e/ -v --tb=short

      - name: Run Regression Tests
        run: |
          cd ai_service
          PYTHONPATH=. python -m pytest ../tests/regression/ -v --tb=short

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Check Rust Formatting & Clippy
        run: |
          cd backend
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports

      - name: Run Backend Tests
        run: |
          cd backend
          cargo test --verbose
