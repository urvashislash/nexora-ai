name: NEXORA AI — CI Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ===========================================================================
  # Rust Backend Tests
  # ===========================================================================
  rust-tests:
    name: 🦀 Rust Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code -A unused_imports

      - name: Build
        run: cargo build --verbose

      - name: Run all tests
        run: cargo test --verbose -- --test-threads=4

      - name: Run tests with output
        run: cargo test --verbose -- --nocapture 2>&1 | tail -50

  # ===========================================================================
  # Python AI Service Tests
  # ===========================================================================
  python-tests:
    name: 🐍 Python AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai_service/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run type checking (mypy)
        run: |
          pip install mypy
          mypy app/ tests/ --check-untyped-defs --ignore-missing-imports

      - name: Run all tests with verbose output
        run: PYTHONPATH=. python -m pytest tests/ -v --tb=short -q

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          PYTHONPATH=. python -m pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=60

  # ===========================================================================
  # E2E Integration Tests
  # ===========================================================================
  e2e-tests:
    name: 🔗 E2E Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: |
          cd ai_service
          pip install -r requirements.txt

      - name: Run E2E scenario tests
        run: |
          cd ai_service
          PYTHONPATH=. python -m pytest ../tests/e2e/ -v --tb=short

  # ===========================================================================
  # Frontend Build & Type Check
  # ===========================================================================
  frontend-checks:
    name: ⚛️ Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Lint (oxlint)
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "❌ Build output missing" && exit 1)
          echo "✅ Build output verified"

  # ===========================================================================
  # SQL Schema Validation
  # ===========================================================================
  schema-validation:
    name: 📊 SQL Schema Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate migration files exist
        run: |
          test -f database/migrations/001_initial_schema.sql || exit 1
          test -f database/migrations/002_indexes_and_rls.sql || exit 1
          test -f database/seeds/001_demo_project_seed.sql || exit 1
          echo "✅ All migration files present"

      - name: Check for SQL syntax issues
        run: |
          for f in database/migrations/*.sql database/seeds/*.sql; do
            echo "Checking $f..."
            # Basic checks: no trailing semicolons missing, no empty files
            if [ ! -s "$f" ]; then
              echo "❌ Empty file: $f"
              exit 1
            fi
            # Check for CREATE TABLE/INDEX statements
            if [[ "$f" == *"001_initial"* ]]; then
              grep -q "CREATE TABLE" "$f" || (echo "❌ No CREATE TABLE in $f" && exit 1)
            fi
          done
          echo "✅ SQL files validated"

  # ===========================================================================
  # Docker Compose Validation
  # ===========================================================================
  docker-validation:
    name: 🐳 Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Check Dockerfiles exist
        run: |
          test -f ai_service/Dockerfile || exit 1
          test -f frontend/Dockerfile || exit 1
          echo "✅ Dockerfiles validated"

  # ===========================================================================
  # Final Gate
  # ===========================================================================
  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    needs: [rust-tests, python-tests, e2e-tests, frontend-checks, schema-validation, docker-validation]

    steps:
      - name: All checks passed
        run: echo "🎉 All CI checks passed — ready to merge!"
