[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["NEXORA AI Team"]
description = "NEXORA AI Rust Trust Plane — Business Rules, Validation, Event Ledger, and Auditing"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.36", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.7", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
lapin = "2.3"
deadpool-lapin = "0.11"
redis = { version = "=0.25.4", features = ["tokio-rustls-comp", "connection-manager"] }
deadpool-redis = { version = "0.15", features = ["rt_tokio_1"] }
tokio-stream = "0.1"
pin-project-lite = "0.2"

[dev-dependencies]
tokio-test = "0.4"
